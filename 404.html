<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지를 찾을 수 없습니다 — Auditfy</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{--ink:#181D27; --ink2:#3D4757; --mut:#69738A; --line:#E6E9F0; --blue:#2B4DE0; --blue-d:#1D3FD8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center;
     padding:24px 16px; text-align:center; line-height:1.6;
     font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.w{max-width:520px}
.code{font-size:.875rem; font-weight:700; letter-spacing:.08em; color:var(--blue); margin:0 0 14px}
h1{margin:0 0 14px; font-size:clamp(1.5rem,5vw,2rem); font-weight:700; letter-spacing:-.02em; line-height:1.35}
p{margin:0 0 28px; color:var(--ink2); font-size:1rem}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
a.btn{display:inline-block; padding:13px 22px; border-radius:10px; font-size:.9375rem; font-weight:600;
      text-decoration:none; transition:background .15s,border-color .15s}
a.p{background:var(--blue); color:#fff}
a.p:hover{background:var(--blue-d)}
a.s{border:1px solid var(--line); color:var(--ink2)}
a.s:hover{border-color:#D7DCE6}
.foot{margin:30px 0 0; font-size:.875rem; color:var(--mut)}
.foot a{color:var(--blue); text-decoration:none}
.foot a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="w">
    <p class="code">404</p>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지일 수 있습니다.</p>
    <div class="btns">
      <a class="btn p" href="/">메인으로 가기</a>
      <a class="btn s" href="/free/">감사보고서 무료 변환</a>
    </div>
    <p class="foot">계속 문제가 있으면 <a href="mailto:hello@auditfy.co.kr">hello@auditfy.co.kr</a>로 알려 주세요.</p>
  </main>
</body>
</html>
